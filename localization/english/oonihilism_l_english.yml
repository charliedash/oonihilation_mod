 #common/story_cycles/99_oonihilism_pet_tiger.txt
 adopt_pet_tiger_decision_name:0 "Adopt a Pet Tiger"
 adopt_pet_tiger_decision_desc:0 "A cub raised in the halls of Guang Guang's faithful grows into a fitting companion — proof that even the fiercest of Oon's creatures can be tamed to serve the Tiger Heralds."
 adopt_pet_tiger_decision_already_pet_tt:0 "Does not already have a pet tiger"
 adopt_pet_tiger_decision_confirm:0 "Adopt a tiger cub"
 adopt_pet_tiger_decision_tooltip:0 "$adopt_pet_tiger_decision_confirm$"

