 tenet_oon_marriage_desc:0 "By marrying close of kin, we emulate the sacred unions of the Oon. Good qualities will be passed down our family line, and thus we gain purity and favor in the eternal battle against evil."

 #Massive piety for marrying a close family member — reimplemented on
 #common/on_action/99_oonihilism_close_kin_marriage_piety.txt to work regardless of marriage-type
