 building_type_holy_site_oonihilism_temple_01_desc:0 "$building_holy_site_oonihilism_temple_01_desc$"

 building_holy_site_oonihilism_temple_02:0 "Great Mausoleum of Oon"
 building_holy_site_oonihilism_temple_02_desc:0 "Restored to its full glory, the mausoleum once again draws the faithful in numbers. Incense smoke curls skyward and the cycle of the Oon turns unbroken, as pilgrims circle the courtyard bearing offerings to Guang Guang and the Three Pure Ones."
 building_type_holy_site_oonihilism_temple_02:0 "$building_holy_site_oonihilism_temple_02$"
