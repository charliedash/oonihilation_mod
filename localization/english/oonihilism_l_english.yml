 ##Oonihilism Decisions

 #Embrace Oonihilism
 embrace_oonihilism_decision:0 "Embrace Oonihilism"
 embrace_oonihilism_decision_desc:0 "I feel the pull of the Great Oon. One way or another, I will bow to Guang Guang's divine will."
 embrace_oonihilism_decision_tooltip:0 "Adopt an Oonihilist faith in secret"
 embrace_oonihilism_decision.tt: "You will choose an Oonihilist faith to worship in [secret|E]"
 embrace_oonihilism_decision_confirm:0 "Guang Guang Be Praised!"

 oonihilism_decisions.02.t: "Embrace Oonihilism"
 oonihilism_decisions.02.desc: "No matter what, I will follow the teachings of Guang Guang and defend agianst the destruction of the Great Oon. But in my hour or need, which faith will I call my own?"
 oonihilism_decisions.02.a: "I will practice [GetFaithByKey('oonihilation').GetName]."

