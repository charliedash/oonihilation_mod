 #Tiger Wrangler court position (common/court_positions/types/99_oonihilism_court_positions.txt)
 tiger_wrangler_court_position:0 "Tiger Wrangler"
 tiger_wrangler_court_position_desc:1 "The $tiger_wrangler_court_position$ is responsible for the care, training, and discipline of the faith's War Tigers and any tigers kept as pets within the household — a post equal parts honor and mortal risk."
 tiger_wrangler_has_pet_tiger:0 "Has experience handling a pet tiger"

 #Tiger Herald camp officer (common/court_positions/types/99_oonihilism_court_positions.txt) — a
 #camp-only counterpart to the Tiger Wrangler, unlocked by the Tiger Cages camp building.
 tiger_herald_camp_officer:0 "Tiger Herald"
 tiger_herald_camp_officer_desc:1 "The $tiger_herald_camp_officer$ trains the war tigers that march with the camp, honing their endurance and their instinct for the chase."
 tiger_herald_camp_officer_parameter_tt:0 "$camp_with_following_buildings_tt$\n$BULLET$[GetDomicileBuilding('baggage_train_tiger_cages').GetName]"

 #Tiger Cages (Adventurer Camp) building parameter tooltip line, mirroring vanilla's
 #domicile_building_parameter_camp_unlocks_kennelperson_officer (localization/english/domiciles/domicile_buildings_l_english.yml)
 domicile_building_parameter_camp_unlocks_tiger_herald_officer: "Unlocks the [GetCourtPositionType('tiger_herald_camp_officer').GetName()] [officer|E]"

 #Tiger Wrangler tasks (common/court_positions/tasks/99_oonihilism_tiger_wrangler_tasks.txt)
 #No on_start custom_tooltip anymore — the auto-generated employer/employee modifier breakdown
 #already covers this, so the mechanical summary lives in _desc instead.
 tiger_wrangler_court_position_task_guard_menagerie:0 "Guard the Menagerie"
 tiger_wrangler_court_position_task_guard_menagerie_desc:0 "Your $tiger_wrangler_court_position$ keeps the tigers leashed and ready at the gates, a living deterrent — their handlers need only give the word to loose them on any who mean harm. Reduces the success chance of hostile schemes against you and raises your natural dread, scaling with [aptitude|E]."

 tiger_wrangler_court_position_task_display_beasts:0 "Display the Beasts"
 tiger_wrangler_court_position_task_display_beasts_desc:0 "Your $tiger_wrangler_court_position$ will parade the tigers on their chains before guests and petitioners alike, a show of wealth and power few other courts can match. Grants monthly prestige and increased [court_grandeur|E], scaling with [aptitude|E]."

 tiger_wrangler_court_position_task_cat_sit:0 "Cat Sit"
 tiger_wrangler_court_position_task_cat_sit_desc:0 "Your $tiger_wrangler_court_position$ will personally see to your pet tiger's needs between hunts, easing your burden and keeping the beast content on its leash. Occasionally eases your [stress|E], growing more frequent with your $tiger_wrangler_court_position$'s [aptitude|E]."
 tiger_wrangler_court_position_task_cat_sit_tt:0 "Every year your $tiger_wrangler_court_position$ has a chance to ease your [stress_loss_i][stress|E], growing more likely with their [aptitude|E]"

 #Notification shown when Cat Sit's yearly stress-relief chance actually triggers (see
 #common/messages/99_oonihilism_messages.txt for the event_tiger_wrangler_good message type).
 tiger_wrangler_cat_sit_relief_title:0 "A Moment's Peace"
 tiger_wrangler_cat_sit_relief_desc:0 "Time spent with your pet tiger loosens the knot in your chest, easing your [stress|E]."

 ##Oonihilism Men-at-Arms
