 TIGER_INFORMATION_STRING:0 "Your tiger's name is #V [Story.Custom('TigerStoryNameAll')].#!\nIt is [Story.MakeScope.Var('tiger_age_variable').GetValue|0] years old."

 #Pet Tiger story cycle events (common/events/oonihilism_events/99_oonihilism_pet_tiger_events.txt)
 oonihilism_pet_tiger.0001.t:0 "A Cub Needs a Name"
 oonihilism_pet_tiger.0001.desc:0 "The tiger cub paces its cage, [ROOT.Char.Custom('TigerCoatColor')] fur catching the light and [ROOT.Char.Custom('TigerEyeColor')] eyes watching you, unblinking. It needs a name before Guang Guang will smile on it."

 oonihilism_pet_tiger.0004.t:0 "A Glimpse of Its Nature"
 oonihilism_pet_tiger.0004.desc:0 "[ROOT.Char.Custom('TigerStoryName')] has grown enough now to show its true temperament. You watch closely as it reacts to the bustle of the household."
 oonihilism_pet_tiger.0004.a:0 "It bares its teeth at every stranger who draws near."
 oonihilism_pet_tiger.0004.b:0 "It presses close to your side, watchful of anyone who isn't you."
 oonihilism_pet_tiger.0004.c:0 "It stretches out in a patch of sun, utterly unbothered."
 oonihilism_pet_tiger.0004.d:0 "It watches everything from the shadows, missing nothing."

 oonihilism_pet_tiger.0002.t:0 "A Wild Thing"
 oonihilism_pet_tiger.0002.desc:0 "[ROOT.Char.Custom('TigerStoryName')] has grown large and restless. It was never truly tame, and keeping it any longer is a gamble against your own household's safety."
 oonihilism_pet_tiger.0002.a:0 "Set it loose in the jungle."
 oonihilism_pet_tiger.0002.a_tt:0 "Release the tiger and end the story"
 oonihilism_pet_tiger.0002.b:0 "Keep it, risk and all."
 oonihilism_pet_tiger.0002.b_tt:0 "Continue keeping the tiger"

 oonihilism_pet_tiger.0003.t:0 "The Tiger Has Died"
 oonihilism_pet_tiger.0003.desc:0 "[ROOT.Char.Custom('TigerStoryName')] has died. Its hide is offered to you, a final gift from a fierce companion."
 oonihilism_pet_tiger.0003.a:0 "Let it be buried with honors."
 oonihilism_pet_tiger.0003.b:0 "Keep the hide as a trophy."

 oonihilism_pet_tiger.0010.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Hearty Meal"
 oonihilism_pet_tiger.0010.desc:0 "You see to it that [ROOT.Char.Custom('TigerStoryName')] is fed well. It watches you contentedly as it eats."
 oonihilism_pet_tiger.0010.a:0 "Good."

 oonihilism_pet_tiger.0011.t:0 "[ROOT.Char.Custom('TigerStoryName')]: Slipped the Cage"
 oonihilism_pet_tiger.0011.desc:0 "[ROOT.Char.Custom('TigerStoryName')] has slipped its cage and prowled the grounds half the night before being found. Your household is shaken."
 oonihilism_pet_tiger.0011.a:0 "See it properly secured."

 oonihilism_pet_tiger.0012.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Fearful Impression"
 oonihilism_pet_tiger.0012.desc:0 "You bring [ROOT.Char.Custom('TigerStoryName')] to greet [scope:cowed_courtier.GetFirstName], who freezes at the sight of its bared teeth. Word of your fearsome companion spreads through the court."
 oonihilism_pet_tiger.0012.a:0 "Let them be impressed."

 oonihilism_pet_tiger.0013.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Mauling"
 oonihilism_pet_tiger.0013.desc:0 "[ROOT.Char.Custom('TigerStoryName')] has mauled [scope:mauled_courtier.GetFirstName] in a sudden fit of temper. The court is in an uproar."
 oonihilism_pet_tiger.0013.a:0 "Apologize and pay for the injury."
 oonihilism_pet_tiger.0013.b:0 "It is a tiger. What did they expect?"

 oonihilism_pet_tiger.0014.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Rival in the Grass"
 oonihilism_pet_tiger.0014.desc:0 "[ROOT.Char.Custom('TigerStoryName')] has caught the scent of a wild rival prowling near the grounds. It snarls, hackles raised, ready to fight."
 oonihilism_pet_tiger.0014.a:0 "Let them settle it themselves."
 oonihilism_pet_tiger.0014.b:0 "Pay the hunters to drive the rival off."

 oonihilism_pet_tiger.0015.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Fearsome Audience"
 oonihilism_pet_tiger.0015.desc:0 "You hold court with [ROOT.Char.Custom('TigerStoryName')] at your side. Petitioners choose their words carefully, all too aware of the beast watching from the dais."
 oonihilism_pet_tiger.0015.a:0 "Let them be careful."

 oonihilism_pet_tiger.0016.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Warning Growl"
 oonihilism_pet_tiger.0016.desc:0 "[ROOT.Char.Custom('TigerStoryName')] growls at [scope:agent.GetFirstName] without cause — or so it seems, until you learn they've been conspiring against you all along."
 oonihilism_pet_tiger.0016.a:0 "Expose the scheme."

 oonihilism_pet_tiger.0023.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Sudden Fury"
 oonihilism_pet_tiger.0023.desc:0 "Without warning, [ROOT.Char.Custom('TigerStoryName')] turns on you, claws and teeth drawing blood before your guards can pull it away."
 oonihilism_pet_tiger.0023.a:0 "It was a moment's madness. Nothing more."
 oonihilism_pet_tiger.0023.b:0 "This cannot happen again. Get rid of it."

 oonihilism_pet_tiger.0020.t:0 "Visiting [ROOT.Char.Custom('TigerStoryName')]"
 oonihilism_pet_tiger.0020.desc:0 "You sit by [ROOT.Char.Custom('TigerStoryName')]'s cage a while, watching it watch you back. There is something calming in its presence."
 oonihilism_pet_tiger.0020.a:0 "Peaceful."

 oonihilism_pet_tiger.0021.t:0 "Visiting [ROOT.Char.Custom('TigerStoryName')]"
 oonihilism_pet_tiger.0021.desc:0 "[ROOT.Char.Custom('TigerStoryName')] presses against the bars as you approach, as close to affectionate as a beast like this can be."
 oonihilism_pet_tiger.0021.a:0 "A rare comfort."

 oonihilism_pet_tiger.0022.t:0 "[ROOT.Char.Custom('TigerStoryName')]: A Foul Mood"
 oonihilism_pet_tiger.0022.desc:0 "[ROOT.Char.Custom('TigerStoryName')] is in a foul mood today, snarling at anyone who comes near, yourself included."
 oonihilism_pet_tiger.0022.a:0 "Leave it be."
