 building_holy_site_oonihilism_temple_01:0 "Ruined Mausoleum of Oon"
 building_holy_site_oonihilism_temple_01_desc:0 "Time and neglect have taken their toll here. Fallen roof tiles litter a cracked courtyard, and the incense braziers have long gone cold, yet pilgrims still come to honor Guang Guang and the Three Pure Ones among the ruins, certain that this ground has been blessed since before memory."
